packages:
  - 'apps/*'
  - 'packages/*'

confirmModulesPurge: false

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  prisma: true

overrides:
  '@nestjs/cli>typescript': 'npm:@typescript/typescript6@6.0.2'
  effect: '3.21.4'
  lodash: '4.18.1'
  multer: '2.2.0'
  path-to-regexp: '8.4.2'
  file-type: '21.3.4'
  flatted: '3.4.2'
  picomatch: '4.0.4'
  defu: '6.1.7'
  body-parser: '2.3.0'
  fast-uri: '3.1.5'
  js-yaml: '4.3.1'
  nanoid: '3.3.18'
  postcss: '8.5.23'
  qs: '6.15.3'
  '@angular-devkit/core>ajv': '8.18.0'
  'ajv-formats>ajv': '8.18.0'
  esbuild: '0.28.1'
  deepmerge-ts: '8.0.0'
  form-data: '4.0.6'
  sharp: '0.35.0'
  undici: '7.29.0'
  vite: '7.3.5'
  'minimatch@3.1.5>brace-expansion': '1.1.18'
  'minimatch@9.0.9>brace-expansion': '2.1.4'
  'minimatch@10.2.4>brace-expansion': '5.0.9'

catalog:
  '@types/node': '20.19.39'
  '@typescript/native': 'npm:typescript@7.0.2'
  '@vitest/coverage-v8': '3.2.6'
  '@typescript-eslint/eslint-plugin': '8.64.0'
  '@typescript-eslint/parser': '8.64.0'
  typescript: 'npm:@typescript/typescript6@6.0.2'
  vitest: '3.2.6'
  zod: '3.25.76'
