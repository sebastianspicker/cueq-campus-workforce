# Local-only PostgreSQL. These non-secret defaults must not be reused in a
# deployed environment.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cueq-postgres
    environment:
      POSTGRES_DB: cueq
      POSTGRES_USER: cueq
      POSTGRES_PASSWORD: cueq_dev_password
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cueq']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
