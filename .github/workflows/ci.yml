# cueq: Continuous Integration
# ================================
# Runs on every pull request and push to main, plus source-alpha tags.
# Validates repository hygiene, contracts, focused tests, and builds.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*-alpha.*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  SKIP_DOCKER: 1
  HUSKY: 0
  DATABASE_URL: ${{ format('postgresql://cueq:{0}@localhost:5432/cueq?schema=public', github.run_id) }}

jobs:
  validate:
    name: Harness Validation
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cueq
          POSTGRES_USER: cueq
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cueq"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Classify validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          changed_files="$(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")"
          non_pages_files="$(printf '%s\n' "${changed_files}" | grep -Ev '^(README\.md|docs/demo/.*|scripts/(build|verify)-pages-demo\.mjs)$' || true)"

          if [ -n "${non_pages_files}" ]; then
            echo "full=true" >> "${GITHUB_OUTPUT}"
          else
            echo "full=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Verify Pages-only change
        if: steps.scope.outputs.full != 'true'
        run: |
          node ./scripts/build-pages-demo.mjs
          node ./scripts/verify-pages-demo.mjs

      - name: Validate alpha tag
        if: steps.scope.outputs.full == 'true' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node ./scripts/validate-release-tag.mjs "${GITHUB_REF_NAME}"

      - name: Setup pnpm
        if: steps.scope.outputs.full == 'true'
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0

      - name: Setup Node.js
        if: steps.scope.outputs.full == 'true'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Cache turbo
        if: steps.scope.outputs.full == 'true'
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        if: steps.scope.outputs.full == 'true'
        run: pnpm install --frozen-lockfile

      - name: Verify generated artifacts
        if: steps.scope.outputs.full == 'true'
        run: |
          make generate
          git diff --exit-code -- contracts/openapi/openapi.json docs/generated/db-schema.md packages/domain/src/generated/schema-contracts.ts

      - name: Audit dependencies
        if: steps.scope.outputs.full == 'true'
        run: pnpm audit --prod --audit-level=high

      - name: Setup
        if: steps.scope.outputs.full == 'true'
        run: SKIP_INSTALL=1 make setup

      - name: Seed verification data
        if: steps.scope.outputs.full == 'true'
        run: pnpm --filter @cueq/database db:seed:baseline

      - name: Check
        if: steps.scope.outputs.full == 'true'
        run: make check

      - name: Build
        if: steps.scope.outputs.full == 'true'
        run: make build

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  fresh-clone-smoke:
    name: Fresh Clone Smoke
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.full == 'true'
    env:
      NODE_ENV: test
      SKIP_DOCKER: 1
      HUSKY: 0
      DATABASE_URL: ${{ format('postgresql://cueq:{0}@localhost:5432/cueq?schema=public', github.run_id) }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cueq
          POSTGRES_USER: cueq
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U cueq"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.24.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Fresh clone setup and check
        run: |
          make setup
          pnpm --filter @cueq/database db:seed:baseline
          make check
