changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - type:feature
    - title: Fixes
      labels:
        - type:bug
    - title: Security and privacy
      labels:
        - security
        - privacy
    - title: Documentation
      labels:
        - documentation
        - type:docs
    - title: Dependencies
      labels:
        - dependencies
    - title: Other changes
      labels:
        - '*'
