name: Feature request
description: Suggest a change to cueq
labels: ['type:feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe who needs this and what makes the current workflow difficult. Use invented examples.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Describe the behavior you would like. A technical design is welcome but not required.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Have you tried another approach?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Include relevant roles, policy requirements, or integration needs if you know them. Leave out private records and personal data.
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This request contains no credentials, real personal data, or private operational records.
          required: true
