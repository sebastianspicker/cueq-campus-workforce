name: Bug report
description: Report something that does not work as expected
labels: ['type:bug']
body:
  - type: markdown
    attributes:
      value: |
        For suspected vulnerabilities, follow our [security policy](https://github.com/sebastianspicker/cueq/blob/main/SECURITY.md) instead of opening a public issue.
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. The page shows ...
    validations:
      required: true
  - type: dropdown
    id: affected_area
    attributes:
      label: Where does this happen?
      options:
        - Web application
        - GitHub Pages demo
        - API
        - Working-time or leave rules
        - Database or migrations
        - Integrations
        - Reporting or audit
        - Documentation or CI
        - Not sure
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your commit or release, browser, operating system, and relevant commands. Use synthetic data in logs and screenshots.
      placeholder: |
        Commit or release:
        Browser / OS:
        Command and output (if relevant):
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: This report contains no credentials, real personal data, or private operational records.
          required: true
